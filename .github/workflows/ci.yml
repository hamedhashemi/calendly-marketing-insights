name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Calendly Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required project files
        shell: bash
        run: |
          required_files=(
            "glue/calendly_landing_to_bronze.py"
            "glue/calendly_bronze_to_silver.py"
            "glue/marketing_spend_landing_to_bronze.py"
            "glue/marketing_spend_bronze_to_silver.py"
            "glue/calendly_marketing_silver_to_gold.py"
            "glue/calendly_operational_gold.py"

            "lambda_calendly_webhook/lambda_function.py"
            "lambda_marketing_spend/lambda_function.py"

            "dashboard/app.py"
            "dashboard/athena_client.py"
            "dashboard/requirements.txt"

            "scripts/ingest_marketing_spend.py"
            "scripts/profile_calendly.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required project files exist."

      - name: Validate Python syntax
        run: |
          python -m compileall \
            glue \
            lambda_calendly_webhook \
            lambda_marketing_spend \
            dashboard \
            scripts

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt

      - name: Verify dashboard dependencies
        run: |
          python -c "import boto3, pandas, plotly, streamlit; print('Dashboard dependencies OK')"

      - name: Check Lambda handlers
        shell: bash
        run: |
          grep -q "def lambda_handler" lambda_calendly_webhook/lambda_function.py
          grep -q "def lambda_handler" lambda_marketing_spend/lambda_function.py

          echo "Lambda handlers found."

      - name: CI summary
        run: |
          echo "Calendly Marketing Insights CI passed."